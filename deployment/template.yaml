# =============================================================================
# ResearchFlow — AWS SAM Template
# =============================================================================
# Infrastructure-as-Code for deploying the LangGraph agent to AWS Lambda
# behind API Gateway.
#
# Deploy with:  sam build && sam deploy --guided
# =============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ResearchFlow — Adaptive Multi-Agent Research Assistant

Parameters:
  PineconeApiKey:
    Type: String
    NoEcho: true
  PineconeIndexName:
    Type: String
    Default: researchflow
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  HitlConfidenceThreshold:
    Type: String
    Default: "0.6"
  MaxRefinementIterations:
    Type: String
    Default: "3"
  CohereApiKey:
    Type: String
    NoEcho: true

Resources:
  ResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 2048
      Timeout: 300
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
      Environment:
        Variables:
          PINECONE_API_KEY: !Ref PineconeApiKey
          PINECONE_INDEX_NAME: !Ref PineconeIndexName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
          HITL_CONFIDENCE_THRESHOLD: !Ref HitlConfidenceThreshold
          MAX_REFINEMENT_ITERATIONS: !Ref MaxRefinementIterations
          COHERE_API_KEY: !Ref CohereApiKey 
          # Critical fixes for Read-only file system
          HF_HOME: /tmp
          NLTK_DATA: /tmp
          XDG_CACHE_HOME: /tmp
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
    Metadata:
      Dockerfile: deployment/Dockerfile
      DockerContext: ..
      DockerTag: v1

Outputs:
  FunctionUrl:
    Description: "Direct Lambda URL (Bypasses 29s timeout)"
    Value: !GetAtt ResearchFunctionUrl.FunctionUrl